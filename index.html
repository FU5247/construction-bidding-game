<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建設入札ゲーム - 6人オンライン対戦</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f3f4f6; }
        .modal-bg { background-color: rgba(0, 0, 0, 0.6); }
        .draggable { cursor: grab; }
        .draggable:active { cursor: grabbing; }
        .dropzone { min-height: 50px; border: 2px dashed #cbd5e1; border-radius: 0.5rem; padding: 0.5rem; transition: background-color 0.2s; }
        .dropzone.dragover { background-color: #e2e8f0; border-color: #3b82f6; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- ヘッダー -->
    <header class="bg-slate-800 text-white p-3 shadow-md flex justify-between items-center z-50 shrink-0">
        <div>
            <h1 class="text-lg font-bold">建設入札ゲーム</h1>
            <p class="text-xs text-slate-300">第 <span id="current-turn" class="text-yellow-400 font-bold text-lg">1</span> / 10 ターン</p>
        </div>
        <div class="flex items-center gap-3">
            <div id="my-role-badge" class="hidden px-3 py-1 rounded bg-blue-600 font-bold text-sm">役職未定</div>
            <button id="room-badge" class="hidden px-2 py-1 bg-indigo-600 rounded text-xs font-bold text-white">ルーム: <span id="header-room-id">---</span></button>
            <button onclick="openLobby()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1 px-3 rounded text-sm transition-colors">🌐 ロビー</button>
        </div>
    </header>

    <!-- メイン画面 -->
    <main class="flex-1 flex overflow-hidden p-2 gap-2 relative">
        <!-- 左側：情報パネル（市場と他プレイヤー状況） -->
        <section class="w-1/3 bg-white p-3 rounded-xl shadow border border-gray-200 overflow-y-auto flex flex-col gap-4">
            <div class="border-b pb-2">
                <h2 class="font-bold text-slate-700 flex items-center gap-1"><span>🏗️</span> 今ターンの入札公告</h2>
                <div id="market-container" class="mt-2 space-y-2">
                    <!-- 市場情報がここに描画される -->
                    <p class="text-sm text-slate-500">ゲーム開始をお待ちください...</p>
                </div>
            </div>
            <div>
                <h2 class="font-bold text-slate-700 flex items-center gap-1 mb-2"><span>👥</span> プレイヤー状況</h2>
                <div id="players-container" class="space-y-2"></div>
            </div>
        </section>

        <!-- 右側：アクションパネル -->
        <section class="w-2/3 bg-white p-4 rounded-xl shadow border border-gray-200 overflow-y-auto relative" id="action-area">
            <div class="flex h-full items-center justify-center flex-col text-center" id="waiting-screen">
                <span class="text-5xl mb-4">🏢</span>
                <h2 class="text-xl font-bold text-slate-700">ロビーからルームに参加・作成してください</h2>
            </div>

            <!-- 下請け用：見積もり入力フォーム -->
            <div id="sub-action-form" class="hidden flex flex-col gap-4">
                <h2 class="text-xl font-black border-b-2 border-blue-500 pb-2">見積もり提出</h2>
                <div id="sub-inputs" class="grid grid-cols-2 gap-4"></div>
                <button onclick="submitSubEstimate()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg mt-4">見積もりを提出する</button>
            </div>

            <!-- 元請け用：入札フォーム -->
            <div id="main-action-form" class="hidden flex flex-col gap-4 h-full">
                <h2 class="text-xl font-black border-b-2 border-green-500 pb-2">入札・下請け割り当て</h2>
                
                <div class="bg-slate-50 p-2 rounded border mb-2">
                    <h3 class="text-sm font-bold text-slate-600 mb-1">提出された見積もり (ドラッグ＆ドロップで割り当て)</h3>
                    <div id="unassigned-subs" class="dropzone flex gap-2"></div>
                </div>

                <div class="grid grid-cols-2 gap-4 flex-1">
                    <!-- 市場① -->
                    <div class="bg-white border-2 border-slate-200 rounded-xl p-3 flex flex-col">
                        <h3 class="font-bold text-center bg-slate-100 rounded py-1 mb-2">市場①: <span id="main-m1-type"></span></h3>
                        <label class="block text-sm font-bold mb-1">入札額 (Y)</label>
                        <input type="number" id="main-m1-bid" class="border p-2 rounded w-full font-bold text-lg mb-2" oninput="calculateMainProfit(1)">
                        
                        <label class="block text-sm font-bold mb-1 text-slate-600">下請けを割り当て</label>
                        <div id="m1-sub-drop" class="dropzone flex-1 flex flex-col gap-1 mb-2"></div>
                        
                        <div class="text-xs text-slate-600 bg-slate-50 p-2 rounded">
                            固定費: 100 Y<br>
                            見積額: <span id="m1-sub-cost">0</span> Y<br>
                            <span class="font-bold text-blue-600">予想利益: <span id="m1-profit">0</span> Y</span>
                        </div>
                    </div>
                    <!-- 市場② -->
                    <div class="bg-white border-2 border-slate-200 rounded-xl p-3 flex flex-col">
                        <h3 class="font-bold text-center bg-slate-100 rounded py-1 mb-2">市場②: <span id="main-m2-type"></span></h3>
                        <label class="block text-sm font-bold mb-1">入札額 (Y)</label>
                        <input type="number" id="main-m2-bid" class="border p-2 rounded w-full font-bold text-lg mb-2" oninput="calculateMainProfit(2)">
                        
                        <label class="block text-sm font-bold mb-1 text-slate-600">下請けを割り当て</label>
                        <div id="m2-sub-drop" class="dropzone flex-1 flex flex-col gap-1 mb-2"></div>
                        
                        <div class="text-xs text-slate-600 bg-slate-50 p-2 rounded">
                            固定費: 100 Y<br>
                            見積額: <span id="m2-sub-cost">0</span> Y<br>
                            <span class="font-bold text-blue-600">予想利益: <span id="m2-profit">0</span> Y</span>
                        </div>
                    </div>
                </div>
                <button onclick="submitMainBid()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-lg mt-2">入札を確定する</button>
            </div>
            
            <!-- 待機オーバーレイ -->
            <div id="action-overlay" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center">
                <div class="animate-spin text-4xl mb-4">⏳</div>
                <h3 class="text-xl font-bold text-slate-700" id="overlay-text">他のプレイヤーを待機中...</h3>
            </div>
        </section>
    </main>

    <!-- ロビーモーダル -->
    <div id="lobby-modal" class="fixed inset-0 modal-bg flex justify-center items-center z-[100] p-4 hidden">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md relative">
            <button onclick="document.getElementById('lobby-modal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 font-bold">✕</button>
            <h2 class="text-2xl font-black text-center mb-6">オンラインロビー</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">プレイヤー名</label>
                    <input type="text" id="player-name" class="w-full border p-2 rounded-lg font-bold" value="プレイヤー">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="createRoom()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow">ルーム作成(ホスト)</button>
                    <div class="flex flex-col gap-1">
                        <input type="text" id="join-room-code" placeholder="コード入力" class="border p-2 rounded-lg text-center font-mono uppercase">
                        <button onclick="joinRoom()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg shadow">参加する</button>
                    </div>
                </div>
                <div id="lobby-status" class="hidden bg-indigo-50 p-4 rounded-lg border border-indigo-200 text-center">
                    <p class="text-sm font-bold text-indigo-800">ルームコード: <span id="display-room-code" class="text-xl font-mono">---</span></p>
                    <p class="text-sm mt-2" id="room-member-count">参加人数: 1 / 6人</p>
                    <button id="start-game-btn" onclick="startGameHost()" class="hidden w-full bg-yellow-400 hover:bg-yellow-500 font-black py-2 rounded mt-3 shadow">ゲームを開始する</button>
                    <p id="host-wait-msg" class="text-xs text-slate-500 mt-2 hidden">ホストの開始を待っています...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 結果モーダル -->
    <div id="result-modal" class="fixed inset-0 modal-bg flex justify-center items-center z-[110] p-4 hidden">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-2xl text-center max-h-[90vh] overflow-y-auto">
            <h2 class="text-2xl font-black mb-4 border-b pb-2">ターン結果発表</h2>
            <div id="result-content" class="space-y-4 text-left"></div>
            <button onclick="closeResult()" class="w-full bg-slate-800 text-white font-bold py-3 rounded-lg mt-6 shadow">確認して次へ</button>
        </div>
    </div>

    <script>
        // Supabase接続設定
        const SUPABASE_URL = 'https://qurypyztchaatyvmmigs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1cnlweXp0Y2hhYXR5dm1taWdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MDgzMzcsImV4cCI6MjEwNTk4NDMzN30.eCsv82GKCULbgvc1dyUyfcG423YHIQ--zQlTDUpqM9g';
        
        // 修正ポイント1: クライアント初期化を安全に行う
        let supabaseClient = null;
        if (window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        let onlineChannel = null;
        let isHost = false;
        let myId = null;
        let roomId = null;
        
        // 役割定義
        const ROLES = [
            { id: 'M_A', name: '元請けA', type: 'main' },
            { id: 'M_B', name: '元請けB', type: 'main' },
            { id: 'S_A1', name: '下請けA1', type: 'sub', parent: 'M_A' },
            { id: 'S_A2', name: '下請けA2', type: 'sub', parent: 'M_A' },
            { id: 'S_B1', name: '下請けB1', type: 'sub', parent: 'M_B' },
            { id: 'S_B2', name: '下請けB2', type: 'sub', parent: 'M_B' },
        ];

        // ゲームステート
        let state = {
            turn: 0,
            phase: 'waiting', // waiting, sub_bidding, main_bidding, results
            market: { m1: null, m2: null }, // 'large' or 'small'
            players: {}, // UUID -> { name, role, money: 1000, restraint: 0 }
            subBids: {}, // 提出された見積もり
            mainBids: {}
        };

        const config = {
            large: { limit: 2000, base: 1800, restraint: 2, subCost: 200 },
            small: { limit: 1000, base: 900, restraint: 1, subCost: 100 },
            fixedCost: 100
        };

        function openLobby() {
            document.getElementById('lobby-modal').classList.remove('hidden');
        }

        // --- 通信処理 ---
        function createRoom() {
            // 修正ポイント2: supabaseClientがnullの場合のアラート追加
            if (!supabaseClient) {
                alert('通信用ライブラリ(Supabase)が読み込まれていません。通信環境を確認してください。');
                return;
            }

            roomId = Math.floor(100000 + Math.random() * 900000).toString();
            myId = 'host-' + Math.random().toString(36).substr(2, 9);
            isHost = true;
            
            state.players[myId] = { 
                name: document.getElementById('player-name').value || 'ホスト', 
                role: null, money: 1000, restraint: 0 
            };

            initRealtime();
            
            document.getElementById('display-room-code').textContent = roomId;
            document.getElementById('lobby-status').classList.remove('hidden');
            document.getElementById('start-game-btn').classList.remove('hidden');
            document.getElementById('host-wait-msg').classList.add('hidden');
            updateLobbyUI();
        }

        function joinRoom() {
            if (!supabaseClient) {
                alert('通信用ライブラリ(Supabase)が読み込まれていません。');
                return;
            }
            roomId = document.getElementById('join-room-code').value.trim().toUpperCase();
            if (!roomId) return alert('コードを入力してください');
            
            myId = 'guest-' + Math.random().toString(36).substr(2, 9);
            isHost = false;
            initRealtime();

            document.getElementById('display-room-code').textContent = roomId;
            document.getElementById('lobby-status').classList.remove('hidden');
            document.getElementById('start-game-btn').classList.add('hidden');
            document.getElementById('host-wait-msg').classList.remove('hidden');
        }

        function initRealtime() {
            if (onlineChannel) supabaseClient.removeChannel(onlineChannel);
            onlineChannel = supabaseClient.channel(`room_${roomId}`, {
                config: { presence: { key: myId } }
            });

            onlineChannel
                .on('broadcast', { event: 'state_sync' }, payload => {
                    state = payload.payload;
                    renderGame();
                })
                .on('broadcast', { event: 'sub_submit' }, payload => {
                    if (isHost) handleSubSubmit(payload.payload.id, payload.payload.bids);
                })
                .on('broadcast', { event: 'main_submit' }, payload => {
                    if (isHost) handleMainSubmit(payload.payload.id, payload.payload.bids);
                })
                .on('broadcast', { event: 'join_request' }, payload => {
                    if (isHost && Object.keys(state.players).length < 6) {
                        state.players[payload.payload.id] = {
                            name: payload.payload.name,
                            role: null, money: 1000, restraint: 0
                        };
                        broadcastState();
                        updateLobbyUI();
                    }
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        document.getElementById('header-room-id').textContent = roomId;
                        document.getElementById('room-badge').classList.remove('hidden');
                        if (!isHost) {
                            await onlineChannel.send({
                                type: 'broadcast', event: 'join_request',
                                payload: { id: myId, name: document.getElementById('player-name').value || 'ゲスト' }
                            });
                        }
                    }
                });
        }

        function broadcastState() {
            if (!isHost) return;
            onlineChannel.send({ type: 'broadcast', event: 'state_sync', payload: state });
            renderGame();
            updateLobbyUI();
        }

        function updateLobbyUI() {
            const count = Object.keys(state.players).length;
            document.getElementById('room-member-count').textContent = `参加人数: ${count} / 6人`;
            // テスト用に1人でも開始可能にする
            if (isHost) document.getElementById('start-game-btn').disabled = false;
        }

        // --- ホスト用ゲーム進行処理 ---
        function startGameHost() {
            if (!isHost) return;
            
            // 人数が足りない場合はCPU（Bot）で埋める
            let currentCount = Object.keys(state.players).length;
            for(let i = currentCount; i < 6; i++) {
                state.players['bot_'+i] = { name: 'CPU_'+i, role: null, money: 1000, restraint: 0, isBot: true };
            }

            // 役割をシャッフルして割り当て
            let pIds = Object.keys(state.players);
            let rolesCopy = [...ROLES].sort(() => Math.random() - 0.5);
            pIds.forEach((id, index) => {
                state.players[id].role = rolesCopy[index].id;
            });

            document.getElementById('lobby-modal').classList.add('hidden');
            state.turn = 1;
            startTurn();
        }

        function startTurn() {
            state.phase = 'sub_bidding';
            state.subBids = {};
            state.mainBids = {};
            
            // 市場生成
            state.market.m1 = Math.random() < 0.5 ? 'large' : 'small';
            state.market.m2 = Math.random() < 0.5 ? 'large' : 'small';

            // 拘束ターンの減少
            Object.values(state.players).forEach(p => {
                if (p.restraint > 0) p.restraint--;
            });

            broadcastState();
            
            // Bot処理（下請け）
            setTimeout(processBotSubmits, 2000);
        }

        function processBotSubmits() {
            if(!isHost) return;
            Object.entries(state.players).forEach(([id, p]) => {
                if(p.isBot && ROLES.find(r=>r.id===p.role).type === 'sub') {
                    if(p.restraint === 0) {
                        let isSame = state.market.m1 === state.market.m2;
                        let bids = {};
                        if(isSame) {
                            let type = state.market.m1;
                            bids[type] = config[type].subCost + Math.floor(Math.random()*200+50);
                        } else {
                            bids['large'] = config['large'].subCost + Math.floor(Math.random()*300+100);
                            bids['small'] = config['small'].subCost + Math.floor(Math.random()*150+50);
                        }
                        handleSubSubmit(id, bids);
                    } else {
                        handleSubSubmit(id, { pass: true });
                    }
                }
            });
        }

        function handleSubSubmit(playerId, bids) {
            state.subBids[playerId] = bids;
            
            // 全下請けが提出したかチェック
            const subIds = Object.entries(state.players)
                .filter(([id, p]) => ROLES.find(r=>r.id===p.role).type === 'sub')
                .map(([id, p]) => id);
                
            if (subIds.every(id => state.subBids[id])) {
                state.phase = 'main_bidding';
                broadcastState();
                setTimeout(processBotMainSubmits, 2000);
            } else {
                broadcastState(); // 進行状況更新のため
            }
        }
        
        function processBotMainSubmits() {
            if(!isHost) return;
            Object.entries(state.players).forEach(([id, p]) => {
                if(p.isBot && ROLES.find(r=>r.id===p.role).type === 'main') {
                    let mySubs = Object.entries(state.players).filter(([sid, sp]) => ROLES.find(r=>r.id===sp.role).parent === p.role);
                    // Botは適当に割り当て
                    let bidObj = {
                        m1: { bid: config[state.market.m1].base, subId: mySubs[0][0], subPrice: state.subBids[mySubs[0][0]]?.[state.market.m1] || (state.subBids[mySubs[0][0]]?.pass ? 0 : Object.values(state.subBids[mySubs[0][0]] || {})[0] || 0) },
                        m2: { bid: config[state.market.m2].base, subId: mySubs[1][0], subPrice: state.subBids[mySubs[1][0]]?.[state.market.m2] || (state.subBids[mySubs[1][0]]?.pass ? 0 : Object.values(state.subBids[mySubs[1][0]] || {})[0] || 0) }
                    };
                    handleMainSubmit(id, bidObj);
                }
            });
        }

        function handleMainSubmit(playerId, bidObj) {
            state.mainBids[playerId] = bidObj;
            
            const mainIds = Object.entries(state.players)
                .filter(([id, p]) => ROLES.find(r=>r.id===p.role).type === 'main')
                .map(([id, p]) => id);
                
            if (mainIds.every(id => state.mainBids[id])) {
                calculateResults();
            } else {
                broadcastState();
            }
        }

        function calculateResults() {
            const m1Type = state.market.m1;
            const m2Type = state.market.m2;
            
            // スコア計算 (70 + (bid < base ? -2 : 2)) * limit / bid
            const getScore = (bid, type) => {
                if(bid <= 0) return -1;
                const c = config[type];
                const baseScore = bid < c.base ? 68 : 72;
                return (baseScore * c.limit) / bid;
            };

            let res = { m1: { winner: null, log: '' }, m2: { winner: null, log: '' }, profits: {} };

            // 固定費減算 (毎ターン100Y)
            Object.keys(state.players).forEach(id => {
                state.players[id].money -= config.fixedCost;
                res.profits[id] = -config.fixedCost;
            });

            const processMarket = (mKey, type) => {
                let bids = [];
                Object.entries(state.mainBids).forEach(([mId, data]) => {
                    let b = data[mKey];
                    if (b && b.bid > 0) {
                        bids.push({ id: mId, bid: b.bid, subId: b.subId, subPrice: b.subPrice, score: getScore(b.bid, type) });
                    }
                });

                if (bids.length > 0) {
                    bids.sort((a, b) => b.score - a.score);
                    // 同点の場合は抽選 (簡単のためシャッフル)
                    if (bids.length > 1 && bids[0].score === bids[1].score) {
                        let topScore = bids[0].score;
                        let tied = bids.filter(b => b.score === topScore);
                        tied.sort(() => Math.random() - 0.5);
                        bids = tied; // 勝者を先頭に
                    }
                    
                    let winner = bids[0];
                    res[mKey].winner = winner;
                    res[mKey].log = `${state.players[winner.id].name} が ${winner.bid}Y で落札！ (総合点: ${winner.score.toFixed(2)})`;
                    
                    // 利益反映
                    let mainProfit = winner.bid - winner.subPrice;
                    state.players[winner.id].money += mainProfit;
                    res.profits[winner.id] += mainProfit;

                    if (winner.subId && state.players[winner.subId]) {
                        state.players[winner.subId].money += winner.subPrice;
                        res.profits[winner.subId] += winner.subPrice;
                        // 拘束付与
                        state.players[winner.subId].restraint = config[type].restraint;
                    }
                } else {
                    res[mKey].log = `入札者なし`;
                }
            };

            processMarket('m1', m1Type);
            processMarket('m2', m2Type);

            state.lastResults = res;
            state.phase = 'results';
            broadcastState();
        }

        function hostNextTurn() {
            if(!isHost) return;
            if (state.turn >= 10) {
                alert('ゲーム終了！');
                // 終了処理
            } else {
                state.turn++;
                startTurn();
            }
        }


        // --- UI・クライアント処理 ---
        function renderGame() {
            document.getElementById('lobby-modal').classList.add('hidden');
            document.getElementById('current-turn').textContent = state.turn;
            document.getElementById('waiting-screen').classList.add('hidden');
            
            // 役職バッジ
            const myData = state.players[myId];
            if (myData && myData.role) {
                const roleInfo = ROLES.find(r => r.id === myData.role);
                document.getElementById('my-role-badge').textContent = roleInfo.name;
                document.getElementById('my-role-badge').classList.remove('hidden');
            }

            // プレイヤーリスト描画
            const pContainer = document.getElementById('players-container');
            pContainer.innerHTML = '';
            Object.entries(state.players).forEach(([id, p]) => {
                let roleName = ROLES.find(r => r.id === p.role)?.name || '観戦';
                let resText = p.restraint > 0 ? `<span class="text-xs text-red-500 font-bold ml-2">拘束中(${p.restraint}T)</span>` : '';
                pContainer.innerHTML += `
                    <div class="flex justify-between items-center p-2 bg-slate-50 border rounded text-sm ${id===myId?'border-blue-400 bg-blue-50':''}">
                        <div><span class="font-bold">${p.name}</span> <span class="text-xs text-slate-500">(${roleName})</span>${resText}</div>
                        <div class="font-black text-lg ${p.money<0?'text-red-600':''}">${p.money} Y</div>
                    </div>`;
            });

            // 市場情報描画
            if (state.market.m1) {
                const mContainer = document.getElementById('market-container');
                mContainer.innerHTML = `
                    <div class="bg-blue-50 p-2 rounded border border-blue-200">
                        <span class="font-bold text-blue-800">市場①: ${state.market.m1 === 'large' ? '大工事' : '小工事'}</span>
                        <div class="text-xs text-slate-600 mt-1">調査基準価格: ${config[state.market.m1].base}Y / 上限: ${config[state.market.m1].limit}Y / 拘束: ${config[state.market.m1].restraint}T</div>
                    </div>
                    <div class="bg-blue-50 p-2 rounded border border-blue-200">
                        <span class="font-bold text-blue-800">市場②: ${state.market.m2 === 'large' ? '大工事' : '小工事'}</span>
                        <div class="text-xs text-slate-600 mt-1">調査基準価格: ${config[state.market.m2].base}Y / 上限: ${config[state.market.m2].limit}Y / 拘束: ${config[state.market.m2].restraint}T</div>
                    </div>
                `;
            }

            // 画面切り替え
            document.getElementById('sub-action-form').classList.add('hidden');
            document.getElementById('main-action-form').classList.add('hidden');
            document.getElementById('action-overlay').classList.add('hidden');
            
            if (!myData || !myData.role) return;
            const roleInfo = ROLES.find(r => r.id === myData.role);

            if (state.phase === 'sub_bidding' && roleInfo.type === 'sub') {
                if (myData.restraint > 0) {
                    showOverlay(`拘束中のためスキップされます (残り ${myData.restraint} ターン)`);
                    if(isHost) {
                        // ホスト自身が拘束中の場合の自動パス
                    } else if (!state.subBids[myId]) {
                        onlineChannel.send({ type: 'broadcast', event: 'sub_submit', payload: { id: myId, bids: { pass: true } } });
                    }
                } else if (state.subBids[myId]) {
                    showOverlay('提出完了。元請けの入札を待っています...');
                } else {
                    renderSubForm();
                }
            } 
            else if (state.phase === 'sub_bidding' && roleInfo.type === 'main') {
                showOverlay('下請けの見積もり提出を待っています...');
            }
            else if (state.phase === 'main_bidding' && roleInfo.type === 'main') {
                if (state.mainBids[myId]) {
                    showOverlay('他の元請けの提出を待っています...');
                } else {
                    renderMainForm();
                }
            }
            else if (state.phase === 'main_bidding' && roleInfo.type === 'sub') {
                showOverlay('元請けが入札・割り当てを行っています...');
            }
            else if (state.phase === 'results') {
                renderResults();
            }
        }

        function showOverlay(text) {
            document.getElementById('action-overlay').classList.remove('hidden');
            document.getElementById('overlay-text').textContent = text;
        }

        function renderSubForm() {
            document.getElementById('sub-action-form').classList.remove('hidden');
            const container = document.getElementById('sub-inputs');
            container.innerHTML = '';

            const m1 = state.market.m1;
            const m2 = state.market.m2;
            
            const createInput = (key, type) => {
                let cost = config[type].subCost;
                let name = type === 'large' ? '大工事' : '小工事';
                return `
                    <div class="bg-slate-50 p-3 rounded-lg border">
                        <h3 class="font-bold mb-2">${name} の見積額</h3>
                        <input type="number" id="sub-est-${key}" class="w-full border p-2 rounded mb-2 font-bold text-lg" oninput="updateSubProfit('${key}', ${cost})">
                        <div class="text-sm text-slate-600">
                            工事原価: ${cost} Y<br>
                            利益: <span id="sub-prof-${key}" class="font-bold text-blue-600">0</span> Y
                        </div>
                    </div>
                `;
            };

            if (m1 === m2) {
                container.innerHTML = createInput(m1, m1);
            } else {
                container.innerHTML = createInput('large', 'large') + createInput('small', 'small');
            }
        }

        function updateSubProfit(key, cost) {
            const val = parseInt(document.getElementById(`sub-est-${key}`).value) || 0;
            document.getElementById(`sub-prof-${key}`).textContent = val - cost;
        }

        function submitSubEstimate() {
            let bids = {};
            if (state.market.m1 === state.market.m2) {
                let type = state.market.m1;
                bids[type] = parseInt(document.getElementById(`sub-est-${type}`).value) || 0;
            } else {
                bids['large'] = parseInt(document.getElementById('sub-est-large').value) || 0;
                bids['small'] = parseInt(document.getElementById('sub-est-small').value) || 0;
            }

            if(isHost) handleSubSubmit(myId, bids);
            else onlineChannel.send({ type: 'broadcast', event: 'sub_submit', payload: { id: myId, bids } });
            
            showOverlay('提出完了。');
        }

        function renderMainForm() {
            document.getElementById('main-action-form').classList.remove('hidden');
            document.getElementById('main-m1-type').textContent = state.market.m1 === 'large' ? '大工事' : '小工事';
            document.getElementById('main-m2-type').textContent = state.market.m2 === 'large' ? '大工事' : '小工事';
            
            // 自分の配下の下請けを取得
            const myRole = state.players[myId].role;
            const mySubs = Object.entries(state.players).filter(([id, p]) => ROLES.find(r=>r.id===p.role).parent === myRole);
            
            const unassigned = document.getElementById('unassigned-subs');
            unassigned.innerHTML = '';
            
            mySubs.forEach(([sid, p]) => {
                let subData = state.subBids[sid];
                if(subData && !subData.pass) {
                    // HTML5 DnD setup
                    let div = document.createElement('div');
                    div.className = "bg-blue-100 p-2 rounded border border-blue-300 draggable text-sm cursor-grab active:cursor-grabbing font-bold";
                    div.draggable = true;
                    div.id = `sub-card-${sid}`;
                    // データ属性に価格を保持 (m1用, m2用)
                    div.dataset.id = sid;
                    
                    let p1 = subData[state.market.m1] || (Object.values(subData)[0]);
                    let p2 = subData[state.market.m2] || (Object.values(subData)[0]);
                    div.dataset.p1 = p1;
                    div.dataset.p2 = p2;
                    div.innerHTML = `👷 ${p.name} <br><span class="text-xs font-normal">①:${p1}Y / ②:${p2}Y</span>`;
                    
                    div.ondragstart = (e) => { e.dataTransfer.setData('text/plain', sid); };
                    unassigned.appendChild(div);
                }
            });

            setupDropzone('unassigned-subs', 0);
            setupDropzone('m1-sub-drop', 1);
            setupDropzone('m2-sub-drop', 2);
        }

        function setupDropzone(id, marketIndex) {
            const zone = document.getElementById(id);
            zone.ondragover = (e) => { e.preventDefault(); zone.classList.add('dragover'); };
            zone.ondragleave = (e) => { zone.classList.remove('dragover'); };
            zone.ondrop = (e) => {
                e.preventDefault();
                zone.classList.remove('dragover');
                const sid = e.dataTransfer.getData('text/plain');
                const el = document.getElementById(`sub-card-${sid}`);
                if(el && zone.children.length === 0 || id === 'unassigned-subs') {
                    zone.appendChild(el);
                    calculateMainProfit(1);
                    calculateMainProfit(2);
                }
            };
        }

        function calculateMainProfit(mIdx) {
            const bidStr = document.getElementById(`main-m${mIdx}-bid`).value;
            const bid = parseInt(bidStr) || 0;
            const zone = document.getElementById(`m${mIdx}-sub-drop`);
            let subCost = 0;
            if(zone.children.length > 0) {
                const el = zone.children[0];
                subCost = parseInt(mIdx === 1 ? el.dataset.p1 : el.dataset.p2);
            }
            document.getElementById(`m${mIdx}-sub-cost`).textContent = subCost;
            document.getElementById(`m${mIdx}-profit`).textContent = bid - 100 - subCost;
        }

        function submitMainBid() {
            const getZoneData = (mIdx) => {
                const zone = document.getElementById(`m${mIdx}-sub-drop`);
                if(zone.children.length > 0) {
                    let el = zone.children[0];
                    return { subId: el.dataset.id, subPrice: parseInt(mIdx===1 ? el.dataset.p1 : el.dataset.p2) };
                }
                return { subId: null, subPrice: 0 };
            };

            const z1 = getZoneData(1);
            const z2 = getZoneData(2);

            let bids = {
                m1: { bid: parseInt(document.getElementById(`main-m1-bid`).value) || 0, subId: z1.subId, subPrice: z1.subPrice },
                m2: { bid: parseInt(document.getElementById(`main-m2-bid`).value) || 0, subId: z2.subId, subPrice: z2.subPrice }
            };

            if(isHost) handleMainSubmit(myId, bids);
            else onlineChannel.send({ type: 'broadcast', event: 'main_submit', payload: { id: myId, bids } });
            
            showOverlay('提出完了。結果を待機中...');
        }

        function renderResults() {
            const modal = document.getElementById('result-modal');
            const container = document.getElementById('result-content');
            
            if(!state.lastResults) return;

            let html = `
                <div class="bg-blue-50 p-3 rounded border border-blue-200">
                    <h3 class="font-bold">市場① (${state.market.m1==='large'?'大工事':'小工事'})</h3>
                    <p class="text-sm mt-1">${state.lastResults.m1.log}</p>
                </div>
                <div class="bg-blue-50 p-3 rounded border border-blue-200 mt-2">
                    <h3 class="font-bold">市場② (${state.market.m2==='large'?'大工事':'小工事'})</h3>
                    <p class="text-sm mt-1">${state.lastResults.m2.log}</p>
                </div>
                <h3 class="font-bold mt-4 border-b pb-1">今ターンの収支 (固定費-100Y含む)</h3>
                <div class="grid grid-cols-2 gap-2 mt-2">
            `;
            
            Object.entries(state.lastResults.profits).forEach(([id, prof]) => {
                html += `<div class="bg-slate-50 p-2 rounded border text-sm flex justify-between">
                    <span>${state.players[id].name}</span>
                    <span class="font-bold ${prof>0?'text-green-600':(prof<0?'text-red-600':'')}">${prof>0?'+':''}${prof}Y</span>
                </div>`;
            });
            html += `</div>`;
            
            container.innerHTML = html;
            modal.classList.remove('hidden');
        }

        function closeResult() {
            document.getElementById('result-modal').classList.add('hidden');
            showOverlay('次のターンへ移行中...');
            if(isHost) {
                setTimeout(hostNextTurn, 1000);
            }
        }

    </script>
</body>
</html>
